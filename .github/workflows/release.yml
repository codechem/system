name: CI

on:
  push:
    branches: [main]
    tags: ['tokens-v*', 'components-v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@12
      - run: node --test scripts/*.test.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12
      - run: npm ci
      - name: Read package, version and npm dist-tag from the tag
        id: target
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-target.mjs
      - name: Set the package version
        run: npm version "$VERSION" --no-git-tag-version -w "@codechem/$PKG"
        env:
          PKG: ${{ steps.target.outputs.pkg }}
          VERSION: ${{ steps.target.outputs.version }}
      - run: npm run build
      - name: Fail if tokens were removed without a breaking version bump
        if: steps.target.outputs.pkg == 'tokens'
        run: node scripts/check-token-breaking.mjs
      - name: Pin components to the published tokens version
        if: steps.target.outputs.pkg == 'components'
        run: node scripts/pin-tokens.mjs
      - name: Publish the package with the appropriate npm dist-tag
        run: npm publish --access public --provenance --tag "$DIST_TAG" -w "@codechem/$PKG"
        env:
          PKG: ${{ steps.target.outputs.pkg }}
          DIST_TAG: ${{ steps.target.outputs.dist_tag }}

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check stable release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-tag.mjs
      - name: Generate commit-based release notes
        if: steps.version.outputs.stable == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/release-notes.mjs
          --tag "$RELEASE_TAG"
          --repository "$RELEASE_REPOSITORY"
          --output "$RUNNER_TEMP/release-notes.md"
      - name: Create GitHub Release unless it already exists
        if: steps.version.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/create-release.mjs
          --tag "$RELEASE_TAG"
          --repository "$RELEASE_REPOSITORY"
          --notes-file "$RUNNER_TEMP/release-notes.md"
