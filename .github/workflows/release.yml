name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@12
      - run: node --test scripts/*.test.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version -w @codechem/tokens -w @codechem/components
      - run: npm run build
      - run: npm publish --access public --provenance -w @codechem/tokens -w @codechem/components

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Generate commit-based release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/release-notes.mjs
          --tag "$RELEASE_TAG"
          --repository "$RELEASE_REPOSITORY"
          --output "$RUNNER_TEMP/release-notes.md"
      - name: Create GitHub Release unless it already exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/create-release.mjs
          --tag "$RELEASE_TAG"
          --repository "$RELEASE_REPOSITORY"
          --notes-file "$RUNNER_TEMP/release-notes.md"
