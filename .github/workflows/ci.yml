name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@12
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version -w @codechem/tokens -w @codechem/components
      - run: npm run build
      - run: npm publish --access public --provenance -w @codechem/tokens -w @codechem/components
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
