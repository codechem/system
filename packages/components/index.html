<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>cc components playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:YOPQ,wght@40..300,100..900&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: var(--cc-background);
        color: var(--cc-text-medium-emphasis);
        font-family: var(--cc-typeface-typeface);
      }
      table { border-spacing: 16px 12px; }
      th { font-size: 12px; font-weight: 600; text-align: left; white-space: nowrap; }
      td { white-space: nowrap; }
    </style>
    <script type="module">
      import '@codechem/tokens/tokens.css';
      import './src/index.ts';

      const add = '<svg slot="leading" viewBox="0 0 24 24"><path fill="currentColor" d="M18 13H13V18C13 18.55 12.55 19 12 19C11.45 19 11 18.55 11 18V13H6C5.45 13 5 12.55 5 12C5 11.45 5.45 11 6 11H11V6C11 5.45 11.45 5 12 5C12.55 5 13 5.45 13 6V11H18C18.55 11 19 11.45 19 12C19 12.55 18.55 13 18 13Z"/></svg>';
      const copy = '<svg slot="trailing" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 20H5.5V7C5.5 6.45 5.05 6 4.5 6C3.95 6 3.5 6.45 3.5 7V20C3.5 21.1 4.4 22 5.5 22H15.5C16.05 22 16.5 21.55 16.5 21C16.5 20.45 16.05 20 15.5 20ZM20.5 16V4C20.5 2.9 19.6 2 18.5 2H9.5C8.4 2 7.5 2.9 7.5 4V16C7.5 17.1 8.4 18 9.5 18H18.5C19.6 18 20.5 17.1 20.5 16ZM18.5 16H9.5V4H18.5V16Z"/></svg>';

      const colors = ['primary', 'secondary', 'destructive'];
      const variants = ['filled', 'outlined', 'text'];
      const rows = [];
      for (const size of ['large', 'medium', 'small']) {
        for (const [label, inner, disabled] of [
          ['both icons', add + 'Button' + copy],
          ['leading icon', add + 'Button'],
          ['trailing icon', 'Button' + copy],
          ['no icons', 'Button'],
          ['disabled', add + 'Button' + copy, true],
        ]) {
          const cells = colors.flatMap((color) => variants.map((variant) =>
            `<td><cc-button variant="${variant}" color="${color}" size="${size}"${disabled ? ' disabled' : ''}>${inner}</cc-button></td>`));
          rows.push(`<tr><th>${size} · ${label}</th>${cells.join('')}</tr>`);
        }
      }
      const head = colors.flatMap((c) => variants.map((v) => `<th>${c} / ${v}</th>`)).join('');
      document.querySelector('#grid').innerHTML = `<tr><th></th>${head}</tr>${rows.join('')}`;

      document.querySelectorAll('cc-button').forEach((b) =>
        b.addEventListener('click', () => console.log('clicked:', b.variant, b.color, b.size)),
      );

      const form = document.querySelector('#demo-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        document.querySelector('#result').textContent = 'Submitted: name = "' + new FormData(form).get('name') + '"';
      });
      form.addEventListener('reset', () => (document.querySelector('#result').textContent = 'Form was reset'));
    </script>
  </head>
  <body>
    <h2>Form</h2>
    <form id="demo-form" style="display: flex; gap: 12px; align-items: center">
      <input name="name" value="Elena" required />
      <cc-button type="submit">Submit</cc-button>
      <cc-button type="reset" variant="outlined" color="secondary">Reset</cc-button>
      <cc-button variant="text" color="secondary">Does nothing</cc-button>
      <output id="result"></output>
    </form>
    <h2>All variants</h2>
    <table id="grid"></table>
  </body>
</html>
